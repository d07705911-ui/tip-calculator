<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор чаевых</title>
    <style>
        :root {
            --bg: #020817; --card: #0a1128; --nb: #00b4d8; --ng: #ffd60a;
            --tx: #c8d6e5; --mt: #7b8aa6; --inp: #0d1530; --bd: #1a2540; --rb: #0a1028;
        }
        body.light {
            --bg: #f0f4f8; --card: #fff; --nb: #0077b6; --ng: #e5a100;
            --tx: #1a1a2e; --mt: #5a6a7e; --inp: #f5f7fa; --bd: #d1d9e6; --rb: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh;
            padding: 20px; color: var(--tx); display: flex; justify-content: center; align-items: center;
        }
        body:not(.light) { background-image: radial-gradient(ellipse at 50% 0%, #0d1a3a 0%, transparent 50%); }
        .calc {
            background: var(--card); border-radius: 28px; padding: 28px 24px; width: 100%;
            max-width: 480px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid var(--bd);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .lang-btns { display: flex; gap: 4px; background: var(--inp); border-radius: 30px; padding: 4px; border: 1px solid var(--bd); }
        .lang-btn {
            padding: 8px 14px; border-radius: 26px; border: none; background: transparent;
            color: var(--mt); font-weight: 600; font-size: 0.8rem; cursor: pointer;
        }
        .lang-btn.active { background: var(--nb); color: #020817; font-weight: 700; }
        .theme-btn {
            background: var(--inp); border: 2px solid var(--bd); border-radius: 50%; width: 40px;
            height: 40px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center;
            justify-content: center; color: var(--tx);
        }
        .currency-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
            background: var(--rb); padding: 10px 14px; border-radius: 16px; border: 1px solid var(--bd);
        }
        .currency-row span { font-size: 0.75rem; font-weight: 600; color: var(--mt); }
        .currency-btns { display: flex; gap: 6px; }
        .cur-btn {
            padding: 7px 14px; border-radius: 20px; border: 2px solid var(--bd);
            background: var(--inp); color: var(--tx); font-weight: 700; font-size: 0.78rem; cursor: pointer;
        }
        .cur-btn.active { border-color: var(--ng); background: var(--ng); color: #020817; }
        .rate-info { font-size: 0.68rem; color: var(--mt); margin-left: auto; }
        h1 { font-size: 1.6rem; text-align: center; margin-bottom: 2px; font-weight: 700; color: var(--nb); }
        .subtitle { text-align: center; color: var(--mt); font-size: 0.82rem; margin-bottom: 18px; }
        .tabs {
            display: flex; gap: 4px; margin-bottom: 16px; background: var(--inp);
            border-radius: 16px; padding: 5px; border: 1px solid var(--bd);
        }
        .tab-btn {
            flex: 1; padding: 11px 10px; border: none; background: transparent;
            color: var(--mt); font-weight: 600; font-size: 0.8rem; border-radius: 12px; cursor: pointer;
        }
        .tab-btn.active { background: var(--nb); color: #020817; font-weight: 700; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 0.75rem; font-weight: 600; color: var(--mt);
            margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;
        }
        .input-wrap {
            display: flex; align-items: center; background: var(--inp); border: 2px solid var(--bd);
            border-radius: 16px; overflow: hidden;
        }
        .input-wrap:focus-within { border-color: var(--nb); }
        .prefix { padding: 0 14px; font-weight: 700; color: var(--nb); font-size: 0.95rem; }
        input[type="number"], input[type="text"] {
            flex: 1; background: transparent; border: none; outline: none; color: var(--tx);
            font-size: 1.05rem; padding: 12px 14px 12px 0; font-weight: 500; min-width: 0;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .tip-row { margin-bottom: 16px; }
        .tip-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .tip-label span { font-size: 0.75rem; font-weight: 600; color: var(--mt); text-transform: uppercase; }
        .tip-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
        .tip-btn {
            background: var(--inp); border: 2px solid var(--bd); color: var(--tx);
            padding: 10px 4px; border-radius: 14px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
        }
        .tip-btn.active { background: var(--nb); border-color: var(--nb); color: #020817; }
        .custom-input {
            width: 100%; background: var(--inp); border: 2px solid var(--bd);
            color: var(--tx); padding: 10px 14px; border-radius: 14px; font-size: 0.95rem;
            display: none; outline: none; margin-top: 7px;
        }
        .custom-input.show { display: block; }
        .custom-badge { font-size: 0.72rem; color: var(--nb); font-weight: 600; display: none; }
        .extras { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
        .checkbox-item { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 0.8rem; color: var(--mt); }
        .small-input {
            width: 55px; background: var(--inp); border: 2px solid var(--bd);
            color: var(--tx); border-radius: 10px; padding: 5px 7px; font-size: 0.78rem;
            display: none; text-align: center;
        }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--bd), transparent); margin: 16px 0; }
        .results {
            background: var(--rb); border-radius: 18px; padding: 18px 14px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border: 1px solid var(--bd);
        }
        .result-item { text-align: center; }
        .result-label {
            font-size: 0.67rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--mt); margin-bottom: 4px;
        }
        .result-value { font-size: 1.5rem; font-weight: 700; }
        .result-item.high .result-value { color: var(--ng); font-size: 1.9rem; }
        .chart-box { margin: 16px 0; display: flex; align-items: center; justify-content: center; gap: 18px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .receipt {
            background: #fff; color: #1a1a2e; border-radius: 18px; padding: 22px 18px;
            font-family: 'Courier New', monospace; font-size: 0.82rem; line-height: 1.7;
            max-width: 310px; margin: 16px auto; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        .rec-title { font-size: 1.1rem; font-weight: 700; }
        .rec-dots { border-top: 2px dashed #94a3b8; margin: 10px 0; }
        .rec-row { display: flex; justify-content: space-between; }
        .rec-total {
            font-size: 1.2rem; font-weight: 700; margin-top: 8px;
            border-top: 2px solid #1a1a2e; padding-top: 8px;
        }
        .persons-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
        .person-item {
            display: flex; align-items: center; gap: 8px; background: var(--inp);
            border: 2px solid var(--bd); border-radius: 14px; padding: 7px 12px;
        }
        .remove-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.3rem; }
        .add-btn {
            width: 100%; padding: 12px; border: 2px dashed var(--bd); border-radius: 14px;
            background: transparent; color: var(--mt); cursor: pointer; font-weight: 600; font-size: 0.88rem;
        }
        .person-summary {
            background: var(--rb); border-radius: 14px; padding: 14px; margin-top: 10px;
            display: none; border: 1px solid var(--bd);
        }
        .person-summary-item {
            display: flex; justify-content: space-between; padding: 5px 0;
            font-size: 0.82rem; border-bottom: 1px solid var(--bd);
        }
        .person-summary-item:last-child { border-bottom: none; font-weight: 700; color: var(--ng); }
        .btn-row { display: flex; gap: 8px; margin-top: 14px; }
        .btn-sm {
            flex: 1; padding: 12px 6px; border-radius: 14px; font-size: 0.78rem; font-weight: 700;
            cursor: pointer; border: 2px solid var(--bd); background: var(--inp); color: var(--tx);
            display: flex; align-items: center; justify-content: center; gap: 5px; text-transform: uppercase;
        }
        .btn-sm:hover { border-color: var(--nb); }
        .btn-sm.copied { border-color: #22c55e !important; color: #22c55e !important; }
        .history {
            margin-top: 16px; background: var(--rb); border-radius: 16px;
            padding: 12px 14px; border: 1px solid var(--bd);
        }
        .history h3 {
            font-size: 0.75rem; text-align: center; color: var(--mt);
            margin-bottom: 8px; text-transform: uppercase;
        }
        .history-list {
            list-style: none; display: flex; flex-direction: column;
            gap: 6px; max-height: 130px; overflow-y: auto;
        }
        .history-item {
            display: flex; justify-content: space-between; font-size: 0.75rem;
            padding: 8px 10px; background: var(--inp); border-radius: 12px;
        }
        .hi-desc { color: var(--mt); }
        .hi-value { font-weight: 700; color: var(--ng); }
    </style>
</head>
<body>
<div class="calc">
    <div class="top-bar">
        <div class="lang-btns">
            <button class="lang-btn active" data-lang="ru">🇷🇺 RU</button>
            <button class="lang-btn" data-lang="uz">🇺🇿 UZ</button>
            <button class="lang-btn" data-lang="en">🇺🇸 EN</button>
        </div>
        <button class="theme-btn" id="tb">🌙</button>
    </div>
    <div class="currency-row">
        <span>Валюта:</span>
        <div class="currency-btns">
            <button class="cur-btn" data-cur="RUB">₽ RUB</button>
            <button class="cur-btn active" data-cur="UZS">so'm UZS</button>
            <button class="cur-btn" data-cur="USD">$ USD</button>
        </div>
        <span class="rate-info" id="ri">1 USD ≈ 12800 UZS</span>
    </div>
    <h1>💸 Счёт пополам</h1>
    <p class="subtitle">Калькулятор чаевых</p>
    <div class="tabs">
        <button class="tab-btn active" data-tab="s">Простой</button>
        <button class="tab-btn" data-tab="n">Поимённо</button>
    </div>
    <div class="tab-content active" id="ts">
        <div class="input-group"><label>Сумма счёта</label><div class="input-wrap"><span class="prefix" id="cs">so'm</span><input type="number" id="b" placeholder="0" step="any"></div></div>
        <div class="tip-row">
            <div class="tip-label"><span>Чаевые</span><span class="custom-badge" id="bg1">Свой %</span></div>
            <div class="tip-btns" id="tb1">
                <button class="tip-btn" data-tip="5">5%</button><button class="tip-btn active" data-tip="10">10%</button>
                <button class="tip-btn" data-tip="15">15%</button><button class="tip-btn" data-tip="20">20%</button>
                <button class="tip-btn" data-tip="25">25%</button><button class="tip-btn" data-tip="x">Свой</button>
            </div>
            <input type="number" class="custom-input" id="c1" placeholder="Свой %" step="any">
        </div>
        <div class="input-group"><label>На сколько человек?</label><div class="input-wrap"><span class="prefix">👤</span><input type="number" id="p" value="1" min="1" step="1"></div></div>
        <div class="extras">
            <label class="checkbox-item"><input type="checkbox" id="s1"><span>+ Сервисный сбор (%)</span></label>
            <input type="number" class="small-input" id="sp1" value="10" min="0" step="any">
            <label class="checkbox-item"><input type="checkbox" id="r1"><span>Округлять вверх</span></label>
        </div>
    </div>
    <div class="tab-content" id="tn">
        <div class="input-group"><label>Общая сумма</label><div class="input-wrap"><span class="prefix" id="cs2">so'm</span><input type="number" id="b2" placeholder="0" step="any"></div></div>
        <div class="tip-row">
            <div class="tip-label"><span>Чаевые</span><span class="custom-badge" id="bg2">Свой %</span></div>
            <div class="tip-btns" id="tb2">
                <button class="tip-btn" data-tip="5">5%</button><button class="tip-btn active" data-tip="10">10%</button>
                <button class="tip-btn" data-tip="15">15%</button><button class="tip-btn" data-tip="20">20%</button>
                <button class="tip-btn" data-tip="25">25%</button><button class="tip-btn" data-tip="x">Свой</button>
            </div>
            <input type="number" class="custom-input" id="c2" placeholder="Свой %" step="any">
        </div>
        <label style="font-size:0.73rem;font-weight:600;color:var(--mt);text-transform:uppercase;display:block;margin-bottom:6px;">Кто что заказал?</label>
        <div class="persons-list" id="pl">
            <div class="person-item"><input type="text" class="pn" placeholder="Имя"><input type="number" class="pa" placeholder="Сумма" step="any"><button class="remove-btn">✕</button></div>
            <div class="person-item"><input type="text" class="pn" placeholder="Имя"><input type="number" class="pa" placeholder="Сумма" step="any"><button class="remove-btn">✕</button></div>
        </div>
        <button class="add-btn" id="ap">+ Добавить человека</button>
        <div class="extras" style="margin-top:10px;">
            <label class="checkbox-item"><input type="checkbox" id="s2"><span>+ Сервисный сбор (%)</span></label>
            <input type="number" class="small-input" id="sp2" value="10" min="0" step="any">
            <label class="checkbox-item"><input type="checkbox" id="r2"><span>Округлять вверх</span></label>
        </div>
        <div class="person-summary" id="ps"></div>
    </div>
    <div class="divider"></div>
    <div class="results" id="rb">
        <div class="result-item"><div class="result-label">Чаевые</div><div class="result-value" id="tv">0 so'm</div></div>
        <div class="result-item"><div class="result-label">Общий счёт</div><div class="result-value" id="tov">0 so'm</div></div>
        <div class="result-item high" style="grid-column:span 2;"><div class="result-label">Каждый платит</div><div class="result-value" id="pv">0 so'm</div></div>
    </div>
    <div class="chart-box" id="cb"><canvas id="pc" width="120" height="120"></canvas><div id="cl"></div></div>
    <div class="receipt" id="rc" style="display:none;"></div>
    <div class="btn-row">
        <button class="btn-sm" id="vb">🔊 Озвучить</button>
        <button class="btn-sm" id="sb">📋 Поделиться</button>
        <button class="btn-sm" id="rcb">🧾 Чек</button>
        <button class="btn-sm" id="rb2">🔄 Сбросить</button>
    </div>
    <div class="history"><h3>Последние расчёты</h3><ul class="history-list" id="hl"><li style="text-align:center;color:var(--mt);opacity:0.7;">Пока пусто</li></ul></div>
</div>

function ur(){if(cu==='UZS')$('ri').textContent=D[ln].ruzs;else if(cu==='RUB')$('ri').textContent=D[ln].rrub;else $('ri').textContent=D[ln].rusd}
function c1f(){const b=parseFloat($('b').value)||0;let p=parseInt($('p').value)||1;if(p<1)p=1;let tip=b*(t1/100),s=0;if($('s1').checked){s=b*((parseFloat($('sp1').value)||0)/100);tip+=s}let tot=b+tip,pp=tot/p;if($('r1').checked){pp=Math.ceil(pp);tot=pp*p;tip=tot-b}$('tv').textContent=fm(tip);$('tov').textContent=fm(tot);$('pv').textContent=fm(pp);const pv=$('pv');pv.dataset.t=Math.round(tot);pv.dataset.tip=Math.round(tip);pv.dataset.b=Math.round(b);pv.dataset.s=Math.round(s);pv.dataset.p=p;ch(b,tip-s,s)}
function c2f(){const b=parseFloat($('b2').value)||0;const it=document.querySelectorAll('#pl .person-item');let ps=[],sm=0;it.forEach(i=>{const n=i.querySelector('.pn').value||'?';const a=parseFloat(i.querySelector('.pa').value)||0;ps.push({n:n,a:a});sm+=a});if(!ps.length)return;let tip=b*(t2/100),s=0;if($('s2').checked){s=b*((parseFloat($('sp2').value)||0)/100);tip+=s}if($('r2').checked)tip=Math.ceil(tip);const gr=b+tip;let h='';ps.forEach(p=>{const sh=sm>0?(p.a/sm)*gr:gr/ps.length;h+='<div class="person-summary-item"><span>'+p.n+'</span><span>'+fm(sh)+'</span></div>'});h+='<div class="person-summary-item"><span>'+D[ln].tpp+'</span><span>'+ps.length+'</span></div>';h+='<div class="person-summary-item"><span>'+D[ln].to+'</span><span>'+fm(gr)+'</span></div>';$('ps').innerHTML=h;$('ps').style.display='block';const pv=$('pv');pv.dataset.t=Math.round(gr);pv.dataset.tip=Math.round(tip);pv.dataset.b=Math.round(b);pv.dataset.s=Math.round(s);pv.dataset.p=ps.length;ch(b,tip-s,s)}
function ch(b,tip,s){if(b<=0&&tip<=0&&s<=0){$('cb').style.display='none';return}$('cb').style.display='flex';const ctx=$('pc').getContext('2d');ctx.clearRect(0,0,120,120);const tot=b+tip+s;let st=-Math.PI/2;const sg=[{v:b,c:'#00b4d8',n:D[ln].lb},{v:tip,c:'#ffd60a',n:D[ln].lt},{v:s,c:'#48cae4',n:D[ln].ls}];sg.forEach(x=>{if(x.v<=0)return;const a=(x.v/tot)*2*Math.PI;ctx.beginPath();ctx.moveTo(60,60);ctx.arc(60,60,50,st,st+a);ctx.closePath();ctx.fillStyle=x.c;ctx.fill();st+=a});$('cl').innerHTML=sg.filter(x=>x.v>0).map(x=>'<div class="legend-item"><span class="legend-dot" style="background:'+x.c+'"></span>'+x.n+': '+fm(x.v)+'</div>').join('')}
function rct(){const pv=$('pv');const t=pv.dataset.t||'0',tip=pv.dataset.tip||'0',b=pv.dataset.b||'0',ppl=pv.dataset.p||'1';const pp=Math.round(parseInt(t)/parseInt(ppl))||'0';let h='<div class="rec-title">'+D[ln].rt+'</div><div>'+new Date().toLocaleDateString()+'</div><div class="rec-dots"></div>';h+='<div class="rec-row"><span>'+D[ln].lb+':</span><span>'+fm(b)+'</span></div>';h+='<div class="rec-row"><span>'+D[ln].lt+':</span><span>'+fm(tip)+'</span></div>';h+='<div class="rec-total">'+D[ln].rto+': '+fm(pp)+'</div>';h+='<div style="margin-top:10px;font-style:italic;">'+D[ln].th+'</div>';$('rc').innerHTML=h;$('rc').style.display='block';$('rc').scrollIntoView({behavior:'smooth'})}
function spk(){const pv=$('pv');const t=pv.dataset.t||'0',tip=pv.dataset.tip||'0',ppl=pv.dataset.p||'1';const pp=Math.round(parseInt(t)/parseInt(ppl))||'0';let tx='';if(ln==='ru')tx='Общий счёт '+t+' '+U[cu].s+'. Чаевые '+tip+'. Каждый платит '+pp+' '+U[cu].s+'.';else if(ln==='uz')tx='Umumiy hisob '+t+' '+U[cu].s+'. Choychaqa '+tip+'. Har biri '+pp+' '+U[cu].s+" to'laydi.";else tx='Total bill '+t+' '+U[cu].s+'. Tip '+tip+'. Each pays '+pp+' '+U[cu].s+'.';if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tx);u.lang=ln==='ru'?'ru-RU':ln==='uz'?'uz-UZ':'en-US';u.rate=0.9;window.speechSynthesis.speak(u)}else alert(tx)}
function swc(c){const o=U[cu].r,n=U[c].r;['b','b2'].forEach(id=>{const v=parseFloat($(id).value)||0;$(id).value=v>0?Math.round(v*(o/n)):''});document.querySelectorAll('.pa').forEach(i=>{const v=parseFloat(i.value)||0;i.value=v>0?Math.round(v*(o/n)):''});cu=c;$('cs').textContent=U[c].s;$('cs2').textContent=U[c].s;ur();document.querySelectorAll('.cur-btn').forEach(b=>b.classList.toggle('active',b.dataset.cur===c));localStorage.setItem('tc',c);at()==='s'?c1f():c2f()}
function ub(id,ic,pt){document.querySelectorAll('#'+id+' .tip-btn').forEach(b=>{if(b.dataset.tip==='x')b.classList.toggle('active',ic);else b.classList.toggle('active',!ic&&parseFloat(b.dataset.tip)===pt)})}
function up(){document.querySelectorAll('.pa').forEach(i=>i.addEventListener('input',c2f));document.querySelectorAll('.pn').forEach(i=>i.addEventListener('input',c2f));document.querySelectorAll('.remove-btn').forEach(b=>b.addEventListener('click',function(){if(document.querySelectorAll('#pl .person-item').length<=1)return;this.parentElement.remove();c2f()}))}
function ah(){const pv=$('pv');const t=pv.dataset.t||'0',ppl=pv.dataset.p||'1';if(t==='0')return;const pp=Math.round(parseInt(t)/parseInt(ppl))||'0';const s=U[cu].s;const l=$('hl');const e=l.querySelector('li[style]');if(e)e.remove();const li=document.createElement('li');li.className='history-item';li.innerHTML='<span class="hi-desc">'+t+' '+s+' → '+ppl+' '+(ln==='ru'?'чел.':ln==='uz'?'kishi':'ppl')+'</span><span class="hi-value">'+pp+' '+s+'</span>';l.prepend(li);while(l.children.length>5)l.lastChild.remove();const it=[];l.querySelectorAll('.history-item').forEach(el=>{const d=el.querySelector('.hi-desc'),v=el.querySelector('.hi-value');it.push({desc:d?d.textContent:'',value:v?v.textContent:''})});localStorage.setItem('th',JSON.stringify(it))}
let ht;function sh(){clearTimeout(ht);ht=setTimeout(ah,800)}
function lh(){const r=localStorage.getItem('th');if(!r)return;try{const it=JSON.parse(r);const l=$('hl');const e=l.querySelector('li[style]');if(e)e.remove();it.forEach(i=>{const li=document.createElement('li');li.className='history-item';li.innerHTML='<span class="hi-desc">'+i.desc+'</span><span class="hi-value">'+i.value+'</span>';l.appendChild(li)})}catch(e){}}
function st(m){if(m==='light'){document.body.classList.add('light');$('tb').textContent='☀️'}else{document.body.classList.remove('light');$('tb').textContent='🌙'}localStorage.setItem('tt',m)}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');const t=this.dataset.tab;document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));$(t==='s'?'ts':'tn').classList.add('active');$('rb').style.display=t==='s'?'grid':'none';t==='s'?c1f():c2f()}));
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');tr(this.dataset.lang);at()==='s'?c1f():c2f()}));
document.querySelectorAll('.cur-btn').forEach(b=>b.addEventListener('click',()=>swc(b.dataset.cur)));
document.querySelectorAll('#tb1 .tip-btn').forEach(b=>b.addEventListener('click',function(){const v=this.dataset.tip;if(v==='x'){x1=!0;$('c1').classList.add('show');$('bg1').style.display='inline';$('bg1').textContent=D[ln].cb;const cv=parseFloat($('c1').value);if(!isNaN(cv)&&cv>=0)t1=cv}else{x1=!1;t1=parseFloat(v);$('c1').classList.remove('show');$('bg1').style.display='none'}ub('tb1',x1,t1);c1f()}));
$('c1').addEventListener('input',()=>{if(x1){const v=parseFloat($('c1').value);t1=(!isNaN(v)&&v>=0)?v:0;c1f()}});
document.querySelectorAll('#tb2 .tip-btn').forEach(b=>b.addEventListener('click',function(){const v=this.dataset.tip;if(v==='x'){x2=!0;$('c2').classList.add('show');$('bg2').style.display='inline';$('bg2').textContent=D[ln].cb;const cv=parseFloat($('c2').value);if(!isNaN(cv)&&cv>=0)t2=cv}else{x2=!1;t2=parseFloat(v);$('c2').classList.remove('show');$('bg2').style.display='none'}ub('tb2',x2,t2);c2f()}));
$('c2').addEventListener('input',()=>{if(x2){const v=parseFloat($('c2').value);t2=(!isNaN(v)&&v>=0)?v:0;c2f()}});
$('s1').addEventListener('change',function(){$('sp1').style.display=this.checked?'inline-block':'none';c1f()});
$('sp1').addEventListener('input',c1f);
$('r1').addEventListener('change',c1f);
$('b').addEventListener('input',c1f);
$('p').addEventListener('input',function(){let v=parseInt(this.value);if(isNaN(v)||v<1)this.value=1;c1f()});
$('s2').addEventListener('change',function(){$('sp2').style.display=this.checked?'inline-block':'none';c2f()});
$('sp2').addEventListener('input',c2f);
$('r2').addEventListener('change',c2f);
$('b2').addEventListener('input',c2f);
up();
$('ap').addEventListener('click',()=>{const d=document.createElement('div');d.className='person-item';d.innerHTML='<input type="text" class="pn" placeholder="'+D[ln].pn+'"><input type="number" class="pa" placeholder="'+D[ln].pa+'" step="any"><button class="remove-btn">✕</button>';$('pl').appendChild(d);up();c2f()});
$('rb2').addEventListener('click',()=>{$('b').value='';$('p').value='1';t1=10;x1=!1;$('c1').value='';$('c1').classList.remove('show');$('bg1').style.display='none';$('s1').checked=!1;$('sp1').style.display='none';$('sp1').value='10';$('r1').checked=!1;$('b2').value='';t2=10;x2=!1;$('c2').value='';$('c2').classList.remove('show');$('bg2').style.display='none';$('s2').checked=!1;$('sp2').style.display='none';$('sp2').value='10';$('r2').checked=!1;$('pl').innerHTML='<div class="person-item"><input type="text" class="pn" placeholder="'+D[ln].pn+'"><input type="number" class="pa" placeholder="'+D[ln].pa+'" step="any"><button class="remove-btn">✕</button></div><div class="person-item"><input type="text" class="pn" placeholder="'+D[ln].pn+'"><input type="number" class="pa" placeholder="'+D[ln].pa+'" step="any"><button class="remove-btn">✕</button></div>';up();$('ps').style.display='none';$('rc').style.display='none';ub('tb1',!1,10);ub('tb2',!1,10);at()==='s'?c1f():c2f();ah()});
$('sb').addEventListener('click',()=>{const t=$('pv').dataset.t||'0',p=$('pv').dataset.p||'1',pp=Math.round(parseInt(t)/parseInt(p))||'0';const txt=D[ln].to+': '+t+' '+U[cu].s+'\n'+p+' '+(ln==='ru'?'чел.':ln==='uz'?'kishi':'ppl')+'\n'+D[ln].pv+': '+pp+' '+U[cu].s;navigator.clipboard.writeText(txt).then(()=>{$('sb').textContent=D[ln].cp;$('sb').classList.add('copied');setTimeout(()=>{$('sb').textContent=D[ln].sh;$('sb').classList.remove('copied')},2000)}).catch(()=>alert(txt))});
$('rcb').addEventListener('click',rct);
$('vb').addEventListener('click',spk);
$('b').addEventListener('input',sh);
$('b2').addEventListener('input',sh);
$('p').addEventListener('input',sh);
$('tb').addEventListener('click',()=>{st(document.body.classList.contains('light')?'dark':'light')});
(function(){const tm=localStorage.getItem('tt')||'dark';st(tm);const lg=localStorage.getItem('tl')||'ru';ln=lg;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lg));tr(lg);const sc=localStorage.getItem('tc')||'UZS';swc(sc);lh();c1f()})();
</script>
